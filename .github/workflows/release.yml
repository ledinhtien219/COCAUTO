name: Build and Release CoC Auto APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tên phiên bản phát hành (vd: v1.2.1)'
        required: true
        default: 'v1.2.1'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests & build APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Prepare versioned APK artifact
        id: pkg
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          APK_NAME="CoC-Auto-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: CoC Auto ${{ steps.pkg.outputs.tag }}
          generate_release_notes: true
          body: |
            Bản phát hành tự động **CoC Auto ${{ steps.pkg.outputs.tag }}**
            - Tệp APK: `${{ steps.pkg.outputs.apk_name }}`
            - SHA-256: `${{ steps.pkg.outputs.sha256 }}`
          files: |
            ${{ steps.pkg.outputs.apk_name }}
